name: SonarQube - Serveur local (via tunnel)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sonar-local:
    name: Analyse SonarQube vers le serveur local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build & tests (Maven)
        run: mvn -B -Djava.version=21 test

      - name: Analyse SonarQube (3 tentatives)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Tentative $attempt ==="
            if mvn -B -Djava.version=21 org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
                -Dsonar.plugins.downloadOnlyRequired=true \
                -Dsonar.host.url=$SONAR_HOST_URL \
                -Dsonar.token=$SONAR_TOKEN \
                -Dsonar.projectKey=Webgoat-Demo \
                -Dsonar.projectName="WebGoat Demo"; then
              echo "Analyse SonarQube réussie."
              exit 0
            fi
            echo "Tentative $attempt échouée, nouvel essai..."
            sleep 15
          done
          echo "Échec après 3 tentatives."
          exit 1
