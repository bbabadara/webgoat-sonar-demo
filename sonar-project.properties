sonar.projectKey=webgoat-demo
sonar.projectName=WebGoat Demo
# sonar.host.url=http://localhost:9000

sonar.sources=src/main/java
sonar.tests=src/test/java,src/it/java
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.java.target=21

sonar.exclusions=**/generated/**,**/target/**
sonar.inclusions=**/*.java

# Ignorer la règle de duplication de chaînes de caractères (S1192)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
